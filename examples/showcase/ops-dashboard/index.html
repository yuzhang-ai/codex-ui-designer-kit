<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青岚能源 · 电站运营台</title>
<style>
/* ── Tokens ─────────────────────────────────────────────
   方向：每天早上打开的运营台。冷瓷色底面，白色工作面用同色相软阴影浮起；
   电站行之间保留极淡行线（逐行比较）。深青只负责：主操作、选中、实际发电曲线。
   琥珀 = 预警，暗红 = 故障，绿 = 正常；状态一律配图标和文字。 */
:root{
  --bg:#eef2f4;            /* 页面底色 hsl(200 20% 94%) */
  --surface:#ffffff;       /* 工作面 */
  --well:#f3f6f8;          /* 面内的控件底、分组底 */
  --well-2:#e8edf0;        /* 悬停 */
  --ink:#14232a;           /* 正文 14.5:1 */
  --ink-2:#3c4f56;         /* 次级文字 7.6:1 */
  --muted:#56676e;         /* 说明、坐标轴 ≥5.2:1 */
  --grid:#edf1f3;          /* 图表网格 */
  --rule:rgba(20,35,42,.075); /* 表格行线：分隔可比较的行 */
  --teal:#0f6670;          /* 主操作 / 选中 / 实际发电  hsl(186) */
  --teal-hi:#0b5760;
  --teal-wash:rgba(15,102,112,.08);
  --fc:#8a99a0;            /* 预测线 */
  --sun:#5b8db3;           /* 辐照度 */
  --ok:#2c7a4e;--ok-wash:#e8f3ec;
  --warn:#8f5b00;--warn-mark:#d48c00;--warn-wash:#fbf3e3;
  --fault:#a6382f;--fault-mark:#c4453a;--fault-wash:#fbeeec;
  --r-card:20px;--r-block:12px;--r-sm:6px;--r-pill:999px;
  --sh-1:0 1px 2px rgba(22,52,64,.05),0 10px 28px -16px rgba(22,52,64,.16);
  --sh-2:0 2px 8px rgba(22,52,64,.08),0 28px 64px -20px rgba(22,52,64,.32);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── App frame ─────────────────────────────────────── */
.app{display:grid;grid-template-columns:84px minmax(0,1fr) 384px;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--teal);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 8px 18px -10px rgba(15,102,112,.8)}
.mark svg{width:22px;height:22px;fill:none;stroke:#eaf6f6;stroke-width:1.8;stroke-linecap:round}
.nav{display:flex;flex-direction:column;gap:4px;width:100%}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11.5px;transition:background .2s var(--ease),color .2s}
.nav a:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.nav a[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.nav a[aria-current=page] svg{color:var(--teal)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--fault-mark);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}
.rail .spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:#d7e2e6;color:var(--ink-2);display:grid;place-items:center;font-size:13px;font-weight:600}

.main{min-width:0;padding:20px 28px 40px 8px}
.aside{position:sticky;top:0;height:100vh;padding:20px 20px 20px 0}

/* ── Top bar ───────────────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:2px 0 20px}
.title h1{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:.01em}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:4px;color:var(--muted);font-size:13px}
.demo{padding:1px 9px;border-radius:var(--r-pill);background:var(--well-2);color:var(--ink-2);font-size:12px}
.tools{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:rgba(20,35,42,.055)}
.seg button{min-height:34px;padding:0 16px;border-radius:var(--r-pill);color:var(--ink-2);font-size:13.5px;white-space:nowrap;transition:background .2s var(--ease),color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(22,52,64,.08),0 4px 10px -6px rgba(22,52,64,.25)}
.seg .ct{margin-left:5px;color:var(--muted);font-weight:400}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{width:240px;height:40px;padding:0 14px 0 38px;border:0;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-1);outline:0;transition:box-shadow .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{box-shadow:0 0 0 2px var(--teal),var(--sh-1)}

/* ── Cards ─────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px 0}
.card-h h2{font-size:15px;font-weight:600}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:18px 20px 18px}
.kpi .lb{color:var(--ink-2);font-size:13px}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px;font-size:38px;font-weight:300;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.kpi .d{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600}
.delta svg{width:13px;height:13px;stroke-width:2}
.delta.up{color:var(--ok)}.delta.dn{color:var(--fault)}.delta.eq{color:var(--ink-2)}
.mrow{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:12px;white-space:nowrap}
.meter{flex:1;height:4px;border-radius:2px;background:var(--teal-wash);overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:var(--teal)}
/* ── Main chart ───────────────────────────────────── */
.chart-card{padding-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.key{width:18px;height:0;border-top:2px solid var(--teal);border-radius:1px}
.key.fc{border-top:2px dashed var(--fc)}
.key.sun{height:8px;border:0;border-radius:2px;background:rgba(91,141,179,.32)}
.chart-wrap{position:relative;padding:4px 10px 0 4px;transition:opacity .2s}
.chart-wrap.busy{opacity:.4}
#chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
#chart:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:14px}
.ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ax-t{fill:var(--muted);font-size:11px}
.dl{font-size:12px;font-weight:600;fill:var(--ink)}
.dl-s{font-size:11px;fill:var(--muted)}
.tip{position:absolute;top:0;left:0;min-width:176px;padding:10px 12px;border-radius:var(--r-block);background:var(--surface);box-shadow:var(--sh-2);font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .t{color:var(--muted);margin-bottom:6px}
.tip .r{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;line-height:1.75}
.tip .r b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tip .r span{color:var(--ink-2)}
.tip .r i{display:block;width:12px;border-top:2px solid var(--teal)}
.tip .r i.fc{border-top-style:dashed;border-color:var(--fc)}
.tip .r i.sun{height:6px;border:0;border-radius:2px;background:rgba(91,141,179,.45)}
.tip .gap{margin-top:4px;padding-top:6px;box-shadow:inset 0 1px 0 var(--grid)}
.chart-note{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 22px 0;color:var(--muted);font-size:12px}

/* ── Station table ────────────────────────────────── */
.tbl-h{flex-wrap:wrap;padding-bottom:12px}
.tbl-scroll{overflow-x:auto;padding:0 10px 10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{position:relative;padding:0 12px;height:38px;color:var(--muted);font-weight:400;font-size:12.5px;text-align:left;white-space:nowrap}
th.r,td.r{text-align:right}
th button{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px;margin:0 -6px;border-radius:8px;color:inherit}
th button:hover{color:var(--ink);background:var(--well)}
th button svg{width:12px;height:12px;stroke-width:2;opacity:0;transition:opacity .15s}
th button:hover svg,th button:focus-visible svg{opacity:.45}
th[aria-sort] button{color:var(--ink);font-weight:600}
th[aria-sort] button svg{opacity:1}
th[aria-sort=ascending] button svg{transform:rotate(180deg)}
td{height:60px;padding:0 12px;box-shadow:inset 0 1px 0 var(--rule);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover td{background:#f7f9fa}
tbody tr.sel td{background:var(--teal-wash)}
tbody tr td:first-child{border-radius:12px 0 0 12px}
tbody tr td:last-child{border-radius:0 12px 12px 0}
tbody tr:hover td,tbody tr.sel td,tbody tr:hover+tr td,tbody tr.sel+tr td{box-shadow:none}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.st-name{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.st-name b{font-weight:600;font-size:14px}
.st-name small{color:var(--muted);font-size:12px}
.st-name:focus-visible{outline-offset:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 7px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500}
.pill svg{width:14px;height:14px;stroke-width:1.9}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.fault{background:var(--fault-wash);color:var(--fault)}
.pw{display:inline-flex;align-items:center;gap:12px}
.spark{width:72px;height:24px;overflow:visible}
.unit{color:var(--muted);font-size:12px;margin-left:3px}
.done{display:inline-flex;align-items:center;gap:10px}
.bar{position:relative;width:76px;height:6px;border-radius:3px;background:var(--well-2)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--teal)}
.bar i.lo{background:var(--warn-mark)}
.bar i.bad{background:var(--fault-mark)}
.bar::after{content:"";position:absolute;top:-3px;bottom:-3px;left:calc(100% / 1.1);width:1.5px;border-radius:1px;background:var(--ink-2);opacity:.45}
.done .num{width:46px;text-align:right}
.al{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.al svg{width:15px;height:15px}
.al.fault{color:var(--fault)}.al.warn{color:var(--warn)}.al.none{color:var(--muted)}
.empty{padding:44px 20px 52px;text-align:center}
.empty .ic{width:44px;height:44px;margin:0 auto 12px;border-radius:50%;background:var(--well);display:grid;place-items:center;color:var(--muted)}
.empty h3{font-size:15px;font-weight:600;margin-bottom:4px}
.empty p{color:var(--muted);margin-bottom:16px}
.cards{display:none}

/* ── Buttons ──────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:var(--r-pill);background:var(--well);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s var(--ease),transform .15s}
.btn:hover{background:var(--well-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--teal);color:#f2fafa;box-shadow:0 8px 18px -10px rgba(15,102,112,.75)}
.btn.primary:hover{background:var(--teal-hi)}
.btn.quiet{background:none;color:var(--ink-2);padding:0 12px}
.btn.quiet:hover{background:var(--well)}
.btn[disabled]{opacity:.55;cursor:progress}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--ink-2);transition:background .2s}
.icon-btn:hover{background:var(--well)}

/* ── Aside: attention + detail ────────────────────── */
.panel{max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.panel-scroll{flex:1;overflow-y:auto;padding:0 22px 20px;overscroll-behavior:contain}
.p-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px}
.p-h h2{font-size:17px;font-weight:600;line-height:1.35}
.p-h .meta{margin-top:3px}
.attn{display:grid;gap:8px}
.attn button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;width:100%;padding:14px;border-radius:16px;background:var(--well);text-align:left;transition:background .2s,box-shadow .2s}
.attn button:hover{background:var(--surface);box-shadow:var(--sh-1),0 0 0 1px var(--rule)}
.attn .lv{grid-row:span 2;width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.attn .lv svg{width:17px;height:17px}
.attn .fault .lv{background:var(--fault-wash);color:var(--fault)}
.attn .warn .lv{background:var(--warn-wash);color:var(--warn)}
.attn b{font-weight:600}
.attn .why{grid-column:2/4;color:var(--ink-2);font-size:13px;line-height:1.5}
.attn .loss{color:var(--muted);font-size:12px;white-space:nowrap}
.sec{margin-top:22px}
.sec h3{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:600;margin-bottom:10px}
.sec h3 small{font-weight:400;color:var(--muted);font-size:12px}
.orders{display:grid}
.orders li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;box-shadow:inset 0 1px 0 var(--rule);font-size:13px}
.orders li:first-child{box-shadow:none}
.orders .id{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.orders .s{color:var(--ink-2);font-size:12px}
ul{list-style:none;margin:0;padding:0}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.facts div{padding:10px 12px;border-radius:var(--r-block);background:var(--well)}
.facts span{display:block;color:var(--muted);font-size:12px}
.facts b{font-size:19px;font-weight:400;white-space:nowrap}
.facts b small{font-size:11.5px;color:var(--muted);margin-left:2px}
#mini{display:block;width:100%;height:auto}
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.inv i{aspect-ratio:1.25;border-radius:var(--r-sm);background:#dcebe9;display:grid;place-items:center;font-style:normal;font-size:9.5px;color:var(--teal-hi)}
.inv i.w{background:#f6dfae;color:var(--warn)}
.inv i.f{background:var(--fault-mark);color:#fff}
.inv i.f::before{content:"×";font-size:13px;font-weight:600}
.inv i.w::before{content:"!";font-weight:700;font-size:11px}
.inv-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;color:var(--ink-2);font-size:12px}
.inv-key span{display:inline-flex;align-items:center;gap:6px}
.inv-key i{width:10px;height:10px;border-radius:3px;background:#dcebe9}
.inv-key i.w{background:#f6dfae}.inv-key i.f{background:var(--fault-mark)}
.tl{position:relative;display:grid;gap:2px}
.tl li{position:relative;display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0}
.tl time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.tl .x{position:relative;padding-left:20px}
.tl .x::before{content:"";position:absolute;left:3px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px var(--surface)}
.tl li:not(:last-child) .x::after{content:"";position:absolute;left:6.25px;top:18px;bottom:-14px;width:1.5px;background:var(--grid)}
.tl .fault .x::before{background:var(--fault-mark)}
.tl .warn .x::before{background:var(--warn-mark)}
.tl .x b{display:block;font-weight:500;font-size:13.5px}
.tl .x span{color:var(--muted);font-size:12.5px}
.tl .x .tag{display:inline-block;margin-top:4px;padding:0 8px;border-radius:var(--r-pill);background:var(--well);color:var(--ink-2);font-size:12px}
.tl .x .tag.d{background:var(--teal-wash);color:var(--teal)}
.tl .unread .x b::after{content:"未读";margin-left:6px;padding:0 6px;border-radius:var(--r-pill);background:var(--well-2);color:var(--ink-2);font-size:11px;font-weight:500;vertical-align:1px}
.p-f{display:flex;gap:8px;padding:14px 22px 18px;box-shadow:0 -1px 0 var(--rule)}
.p-f .btn.primary{flex:1}
.scrim{display:none}
.aside.has-d .panel{height:100%}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
.shot *,.shot *::before,.shot *::after{transition:none!important;animation:none!important}
.attn-inline{display:none}

/* ── Dialog & toast ───────────────────────────────── */
dialog{width:min(460px,calc(100vw - 32px));padding:0;border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);box-shadow:var(--sh-2)}
dialog::backdrop{background:rgba(20,35,42,.32)}
.d-b{padding:22px 24px 6px}
.d-b h2{font-size:17px;font-weight:600;margin-bottom:4px}
.d-b > p{color:var(--muted);margin-bottom:18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.field select,.field textarea{width:100%;min-height:42px;padding:9px 14px;border:0;border-radius:var(--r-block);background:var(--well);outline:0;resize:vertical;transition:box-shadow .2s,background .2s}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 18px,calc(100% - 15px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.field select:focus,.field textarea:focus{background-color:var(--surface);box-shadow:0 0 0 2px var(--teal)}
.field textarea{min-height:84px;line-height:1.55}
.d-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 24px 22px}
.err{display:none;grid-template-columns:20px 1fr;gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:var(--r-block);background:var(--fault-wash);color:var(--fault);font-size:13px}
.err.on{display:grid}
.err svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:28px;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 18px 12px 14px;border-radius:var(--r-pill);background:var(--ink);color:#eef5f6;font-size:13.5px;box-shadow:var(--sh-2);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;color:#7fd1b1}

/* ── Loading skeleton ─────────────────────────────── */

<script>
/* ── 演示数据（虚构）───────────────────────────────
   12 座电站。现在 = 11/12 14:20。d = 0…29 对应 10/13…11/11，d = 30 为今天。
   敦煌西 10:42 箱变跳闸（故障）；格尔木南 组件积灰（预警）；哈密东 逆变器过温降额（预警）。 */
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=n=>{n=Math.imul(n^n>>>16,0x45d9f3b);n=Math.imul(n^n>>>16,0x45d9f3b);return((n^n>>>16)>>>0)/4294967296};
const NOW=14+20/60, NOW_TXT='14:20', TODAY=30;
const WK=['周日','周一','周二','周三','周四','周五','周六'];
const dateOf=d=>new Date(2026,9,13+d);
const md=d=>{const t=dateOf(d);return (t.getMonth()+1)+'/'+t.getDate()};
const hhmm=h=>String(Math.floor(h+1e-6)).padStart(2,'0')+':'+String(Math.round((h-Math.floor(h+1e-6))*60)).padStart(2,'0');
const prof=(h,sh)=>{const v=Math.sin(Math.PI*(h-7.3-sh)/10.4);return v>0?Math.pow(v,1.15):0};

/* 天气系数：季节性衰减 + 几个阴天；预测有小误差，今天预测准确 */
const W=[],WF=[];
const CLOUD={5:.62,6:.84,13:.52,14:.88,20:.71,27:.58};
for(let d=0;d<=30;d++){W[d]=(1-.0045*d)*(CLOUD[d]||1);WF[d]=d===30?W[d]:W[d]*(1+(hash(d*31+7)-.5)*.07+(d===27?.14:0))}

const STATIONS=[
 {id:'zb1', name:'张北一号',  reg:'河北 张家口',    cap:150,inv:30,sh:0,  pr:.836},
 {id:'zb2', name:'张北二号',  reg:'河北 张家口',    cap:100,inv:20,sh:0,  pr:.829},
 {id:'dhx', name:'敦煌西',    reg:'甘肃 酒泉',      cap:200,inv:40,sh:.7, pr:.842,status:'fault',bad:[17,18,19,20,21,22,23,24],
   eff:(d,h)=>d===30&&h>=10.7?.8:d===26?.93:1},
 {id:'gem', name:'格尔木南',  reg:'青海 海西',      cap:120,inv:24,sh:.6, pr:.832,status:'warn',eff:d=>.985-.0031*d},
 {id:'gh',  name:'共和光伏园',reg:'青海 海南州',    cap:160,inv:32,sh:.5, pr:.838},
 {id:'hmd', name:'哈密东',    reg:'新疆 哈密',      cap:100,inv:20,sh:1,  pr:.826,status:'warn',warnInv:[12],eff:(d,h)=>d===30&&h>=12.1?.94:1},
 {id:'tlf', name:'吐鲁番北',  reg:'新疆 吐鲁番',    cap:80, inv:16,sh:1,  pr:.821},
 {id:'zw',  name:'中卫沙坡头',reg:'宁夏 中卫',      cap:90, inv:18,sh:.4, pr:.833},
 {id:'dlt', name:'达拉特旗',  reg:'内蒙古 鄂尔多斯',cap:120,inv:24,sh:.15,pr:.830},
 {id:'wlcb',name:'乌兰察布',  reg:'内蒙古 乌兰察布',cap:60, inv:12,sh:.05,pr:.824},
 {id:'dlh', name:'德令哈',    reg:'青海 海西',      cap:50, inv:10,sh:.6, pr:.835},
 {id:'jqym',name:'酒泉玉门',  reg:'甘肃 酒泉',      cap:54, inv:11,sh:.7, pr:.828}
];
const CAP=STATIONS.reduce((a,s)=>a+s.cap,0);
STATIONS.forEach((s,k)=>{s.k=k;s.status=s.status||'ok';s.eff=s.eff||(()=>1)});
const P =(s,d,h)=>s.cap*.72*prof(h,s.sh)*W[d]*s.eff(d,h)*(.986+hash(s.k*7919+d*97+Math.round(h*4))*.028);
const FC=(s,d,h)=>s.cap*.72*prof(h,s.sh)*WF[d];
const IRR=(d,h)=>1010*prof(h,.45)*W[d]*(.985+hash(d*131+Math.round(h*4))*.03);
const avail=(s,d)=>{
  if(s.id==='dhx'&&d===30)return 100*(1-.2*(NOW-10.7)/(NOW-6.5));
  if(s.id==='dhx'&&d===26)return 96.1;
  if(s.id==='hmd'&&d===30)return 99.1;
  return 99.55+hash(s.k*53+d)*.45;
};
/* 半小时积分，today 截至现在 */
function dayE(fn,s,d){const end=d===30?NOW:20;let e=0,prev=fn(s,d,6);for(let h=6.5;h<=end+1e-9;h+=.5){const v=fn(s,d,h);e+=.25*(v+prev);prev=v}
  if(d===30){const h0=Math.floor(NOW*2)/2;e+=(NOW-h0)*(fn(s,d,h0)+fn(s,d,NOW))/2}return e}

const ALARMS={
 dhx:[{t:'10:42',lv:'fault',title:'3# 箱变高压侧跳闸',desc:'INV-17～24 离网，40 MW 容量停发',unread:true},
      {t:'10:43',lv:'warn',title:'INV-17～24 通信中断',desc:'由箱变跳闸引起，恢复供电后自动消除',unread:true},
      {t:'08:15',lv:'info',title:'例行巡检完成',desc:'马骁 · 无异常',unread:false}],

const icon=(id,cls)=>`<svg class="i ${cls||''}" aria-hidden="true"><use href="#${id}"/></svg>`;
const pill=s=>`<span class="pill ${s.status}">${icon(STATUS[s.status].i)}${STATUS[s.status].t}</span>`;
const pct=(v,d=1)=>fmt(v*100,d)+'%';
const signed=(v,d=1)=>{const r=+v.toFixed(d);return(r>0?'+':r<0?'−':'±')+fmt(Math.abs(r),d)};
const isNarrow=()=>matchMedia('(max-width:1279px)').matches;
const TODAY_ROWS=build('day').rows;
const setInert=on=>{$('#main').inert=on;$('.rail').inert=on};

/* ── KPI ───────────────────────────────────────────── */
function renderKpis(loading){
  const box=$('#kpis');
  if(loading){box.querySelectorAll('.v').forEach(v=>v.innerHTML='<span class="sk"></span>');box.querySelectorAll('.d').forEach(d=>d.innerHTML='<span class="sk" style="width:9em"></span>');return}
  const f=S.data.fleet,r=S.range,lbl=RANGE[r].label;
  const gen=f.gen,big=gen>=10000,genV=big?fmt(gen/1000,2):fmt(gen),genU=big?'GWh':'MWh';
  const dGen=(f.gen/f.fc-1)*100;
  const mw=STATIONS.reduce((a,s)=>a+s.mw,0),mwF=STATIONS.reduce((a,s)=>a+s.mwFc,0),dMw=(mw/mwF-1)*100;
  const dPr=(f.pr-f.prExp)*100, dAv=f.av-99.5;
  const D=(v,unit,good,dg=1)=>{const r=+v.toFixed(dg);return `<span class="delta ${r===0?'eq':r>0===good?'up':'dn'}">${r===0?'':icon(r>0?'i-up':'i-down')}${signed(v,dg)}${unit}</span>`};
  const K=[
    {lb:lbl+'发电量',v:genV,u:genU,d:D(dGen,'%',true)+`<span class="vs">比预测 ${fmt(big?f.fc/1000:f.fc,big?2:0)} ${genU}</span>`},
    {lb:'实时功率',lb2:' · 装机 '+fmt(CAP)+' MW',v:fmt(mw),u:'MW',d:D(dMw,'%',true)+`<span class="vs">比预测 ${fmt(mwF)} MW</span>`},
    {lb:'系统 PR',v:fmt(f.pr*100,1),u:'%',d:D(dPr,' 点',true)+`<span class="vs">比预期 ${fmt(f.prExp*100,1)}%</span>`},
    {lb:'可用率',v:fmt(f.av,2),u:'%',d:D(dAv,' 点',true,2)+'<span class="vs">比目标 99.50%</span>'}
  ];
  box.innerHTML=K.map(k=>`<div class="card kpi"><div class="lb">${k.lb}${k.lb2?`<span class="lb2">${k.lb2}</span>`:''}</div><div class="v">${k.v}<small>${k.u}</small></div><div class="d">${k.d}</div></div>`).join('');
}

/* ── 表格 ───────────────────────────────────────────── */
const FILTERS=[['all','全部'],['fault','故障'],['warn','预警'],['ok','正常']];
function renderFilter(){
  $('#filter').innerHTML=FILTERS.map(([k,t])=>{const n=k==='all'?STATIONS.length:STATIONS.filter(s=>s.status===k).length;
    return `<button type="button" role="radio" data-f="${k}" aria-checked="${S.filter===k}" tabindex="${S.filter===k?0:-1}">${t}<span class="ct num">${n}</span></button>`}).join('');
}
function visible(){
  const q=S.q.trim().toLowerCase(),R=S.data.rows;
  let list=STATIONS.filter(s=>(S.filter==='all'||s.status===S.filter)&&(!q||(s.name+s.reg+s.id).toLowerCase().includes(q)));
  const {k,dir}=S.sort,val=s=>k==='name'?s.name:k==='sev'?STATUS[s.status].sev*10+(1-R[s.id].rate):k==='mw'?s.mw:k==='al'?unread(s)*10+STATUS[s.status].sev:R[s.id][k];
  list.sort((a,b)=>{const A=val(a),B=val(b);return(typeof A==='string'?A.localeCompare(B,'zh-CN'):A-B)*dir});
  return list;
}
function renderTable(){
  const R=S.data.rows,list=visible();
  $('#tbl thead th[data-k=gen] button').firstChild.textContent=S.range==='day'?'今日发电':'发电量';
  document.querySelectorAll('#tbl th[data-k]').forEach(th=>{if(th.dataset.k===S.sort.k)th.setAttribute('aria-sort',S.sort.dir>0?'ascending':'descending');else th.removeAttribute('aria-sort')});
  const big=S.range!=='day';
  $('#rows').innerHTML=list.map(s=>{const r=R[s.id],u=unread(s),cls=r.rate<.85?'bad':r.rate<.95?'lo':'';
    return `<tr data-id="${s.id}" class="${S.sel===s.id?'sel':''}">
    <td><button type="button" class="st-name" data-open="${s.id}" aria-label="${s.name}，${STATUS[s.status].t}，查看详情"><b>${s.name}</b><small>${s.reg} · ${s.cap} MW</small></button></td>
    <td>${pill(s)}</td>
    <td class="r num">${fmt(s.mw,1)}<span class="unit">MW</span></td>
    <td class="col-spark">${spark(s)}</td>
    <td class="r num">${big?fmt(r.gen):fmt(r.gen,1)}<span class="unit">MWh</span></td>
    <td><span class="done"><span class="bar" aria-hidden="true"><i class="${cls}" style="width:${Math.min(100,r.rate/1.1*100).toFixed(1)}%"></i></span><span class="num">${pct(r.rate,1)}</span></span></td>
    <td class="r num col-pr">${fmt(r.pr*100,1)}%</td>
    <td>${u?`<span class="al ${s.status}">${icon(STATUS[s.status].i)}${u} 条未读</span>`:'<span class="al none">—<span class="sr">无告警</span></span>'}</td></tr>`}).join('');
  $('#cards').innerHTML=list.map(s=>{const r=R[s.id],u=unread(s),cls=r.rate<.85?'bad':r.rate<.95?'lo':'';
    return `<button type="button" class="sc ${S.sel===s.id?'sel':''}" data-open="${s.id}"><span class="st-name"><b>${s.name}</b><small>${s.reg} · ${s.cap} MW${u?` · ${u} 条未读告警`:''}</small></span>${pill(s)}
    <span class="row num"><span><span>当前功率</span><b>${fmt(s.mw,1)} MW</b></span><span><span>${S.range==='day'?'今日发电':'发电量'}</span><b>${fmt(r.gen)} MWh</b></span><span><span>完成率</span><b>${pct(r.rate,1)}</b></span></span>
    <span class="bar" aria-hidden="true"><i class="${cls}" style="width:${Math.min(100,r.rate/1.1*100).toFixed(1)}%"></i></span></button>`}).join('');
  const empty=!list.length;$('#empty').hidden=!empty;$('#tbl').style.display=empty?'none':'';
  if(empty)$('#emptyWhy').textContent=(S.q?`没有名称或地区包含“${S.q}”的电站`:'当前筛选下没有电站')+(S.filter!=='all'?`（筛选：${FILTERS.find(f=>f[0]===S.filter)[1]}）`:'')+'。';
  const f=S.data.fleet;$('#tblSub').textContent=`${list.length} / ${STATIONS.length} 座 · 完成率 = ${RANGE[S.range].label}实际 ÷ 预测，竖线为 100%`;
}

/* ── 需要处理 + 工单 ───────────────────────────────── */
function attnHtml(){
  const R=TODAY_ROWS;
  return STATIONS.filter(s=>s.status!=='ok').sort((a,b)=>STATUS[b.status].sev-STATUS[a.status].sev).map(s=>{
    const a=s.alarms[0],loss=Math.max(0,R[s.id].fc-R[s.id].gen);
    return `<button type="button" class="${s.status}" data-open="${s.id}"><span class="lv">${icon(STATUS[s.status].i)}</span><b>${s.name} · ${STATUS[s.status].t}</b><span class="loss num">今日少发 ${fmt(loss,1)} MWh</span><span class="why">${a.t} ${a.title}</span></button>`}).join('');
}
function renderAttn(){
  const h=attnHtml(),n=STATIONS.filter(s=>s.status!=='ok').length,u=STATIONS.reduce((a,s)=>a+unread(s),0);
  $('#attnList').innerHTML=h;$('#attnList2').innerHTML=h;
  $('#attnSub').textContent=`${n} 座电站 · ${u} 条未读告警`;$('#attnSub2').textContent=`${n} 座电站 · ${u} 条未读告警`;
  const b=$('#navBadge');b.textContent=u;b.hidden=!u;b.setAttribute('aria-label',u+' 条未读告警');
  $('#ordCount').textContent=ORDERS.length+' 张';
  $('#orders').innerHTML=ORDERS.map(o=>`<li><span>${esc(o.st)} · ${esc(o.what)}</span><span class="s">${esc(o.s)}</span><span class="id">${o.id}</span></li>`).join('');
}

/* ── 详情 ───────────────────────────────────────────── */
function renderDetail(){
  const s=byId(S.sel),v=$('#dView');if(!s)return;
  const r=S.data.rows[s.id],u=unread(s);
  const inv=[...Array(s.inv)].map((_,i)=>{const n=i+1,f=(s.bad||[]).includes(n),w=(s.warnInv||[]).includes(n)||(s.id==='gem'&&n%5===2);
    return `<i class="${f?'f':w?'w':''}" title="INV-${String(n).padStart(2,'0')} ${f?'离网':w?'降额':'正常'}"></i>`}).join('');
  const nf=(s.bad||[]).length,nw=s.inv&&[...Array(s.inv)].filter((_,i)=>(s.warnInv||[]).includes(i+1)||(s.id==='gem'&&(i+1)%5===2)).length;
  v.innerHTML=`<div class="p-h"><div><h2 id="dH">${s.name}</h2><div class="meta">${pill(s)}<span>${s.reg} · ${s.cap} MW · ${s.inv} 台逆变器</span></div></div>
    <button type="button" class="icon-btn" id="dClose" aria-label="关闭详情（Esc）">${icon('i-x')}</button></div>
    <div class="panel-scroll">
      <div class="facts num"><div><span>当前功率</span><b>${fmt(s.mw,1)}<small>MW</small></b></div><div><span>完成率</span><b>${pct(r.rate,1)}</b></div><div><span>可用率</span><b>${fmt(r.av,1)}<small>%</small></b></div></div>
      <div class="sec" style="margin-top:0"><h3>今日功率<small>MW · 实际 / 预测（虚线）</small></h3><svg id="mini" role="img" aria-label="${s.name} 今日功率，当前 ${fmt(s.mw,1)} MW，预测 ${fmt(s.mwFc,1)} MW"></svg></div>
      <div class="sec"><h3>逆变器<small class="num">${s.inv-nf-nw} 正常${nw?` · ${nw} 降额`:''}${nf?` · ${nf} 离网`:''}</small></h3><div class="inv" role="img" aria-label="逆变器状态：${s.inv-nf-nw} 台正常，${nw} 台降额，${nf} 台离网">${inv}</div>
        <div class="inv-key"><span><i></i>正常</span><span><i class="w"></i>降额</span><span><i class="f"></i>离网</span></div></div>
      <div class="sec"><h3>告警记录<small>${u?u+' 条未读':'全部已读'}</small></h3>${s.alarms.length?`<ul class="tl">${s.alarms.map(a=>`<li class="${a.lv}${a.unread&&a.lv!=='info'?' unread':''}"><time>${a.t}</time><div class="x"><b>${esc(a.title)}</b><span>${esc(a.desc)}</span>${a.order?`<br><span class="tag d">已派单 ${a.order}</span>`:''}</div></li>`).join('')}</ul>`:'<p style="color:var(--muted);font-size:13px">今日没有告警。</p>'}</div>
    </div>
    <div class="p-f"><button type="button" class="btn" id="dRead" ${u?'':'disabled style="opacity:.5;cursor:default"'}>${icon('i-check')}标记已读</button><button type="button" class="btn primary" id="dDispatch">${icon('i-send')}派单</button></div>`;
  v.setAttribute('role','region');v.setAttribute('aria-labelledby','dH');
  $('#dClose').onclick=closeDetail;$('#dRead').onclick=markRead;$('#dDispatch').onclick=openDispatch;
  requestAnimationFrame(()=>drawMini(s));
}
function openDetail(id,from){
  S.returnFocus=from||document.activeElement;S.sel=id;
  $('#ovView').hidden=true;$('#dView').hidden=false;renderDetail();renderTable();
  $('#aside').classList.add('open','has-d');if(isNarrow()){$('#scrim').classList.add('on');setInert(true)}
  setTimeout(()=>$('#dClose').focus({focusVisible:!!from}),isNarrow()?60:0);
}
function closeDetail(){
  if(!S.sel)return;const id=S.sel;S.sel=null;
  $('#aside').classList.remove('open','has-d');$('#scrim').classList.remove('on');setInert(false);
  $('#dView').hidden=true;$('#ovView').hidden=false;renderTable();
  const back=document.querySelector(`#rows [data-open="${id}"]`)&&!matchMedia('(max-width:640px)').matches?document.querySelector(`#rows [data-open="${id}"]`):document.querySelector(`#cards [data-open="${id}"]`);
  const t=S.returnFocus&&document.contains(S.returnFocus)?S.returnFocus:back;if(t)t.focus();
}
function markRead(){
  const s=byId(S.sel),n=unread(s);if(!n)return;s.alarms.forEach(a=>a.unread=false);
  renderDetail();renderTable();renderAttn();toast(`已将 ${s.name} 的 ${n} 条告警标记为已读`);$('#dDispatch').focus();
}

/* ── 派单 ───────────────────────────────────────────── */
const PRESET={dhx:['敦煌运维班 · 马骁','P1','3# 箱变高压侧跳闸，INV-17～24 离网。请到场检查保护动作原因，确认后恢复送电。'],
  gem:['格尔木运维班 · 才让','P2','PR 连续 6 天偏低，疑似组件积灰。请安排 1～4 区组件清洗，清洗前后各记录一次 IV 曲线。'],
  hmd:['西北片区 · 周启明','P2','INV-12 过温降额，柜内 71 ℃。请检查散热风扇和滤网。']};
function openDispatch(){
  const s=byId(S.sel),p=PRESET[s.id]||['张北运维班 · 韩雪','P3',''];
  $('#dlgSub').textContent=`${s.name} · ${s.reg}`;$('#fWho').value=p[0];$('#fPri').value=p[1];$('#fNote').value=p[2];
  $('#dlgErr').classList.remove('on');setOk(false,'确认派单');$('#dlg').showModal();$('#fNote').focus();
}
function setOk(busy,t){const b=$('#dlgOk');b.disabled=busy;b.innerHTML=icon('i-send')+t}
$('#dlgCancel').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>{$('#dDispatch')&&$('#dDispatch').focus()});
$('#dlgForm').addEventListener('submit',e=>{
  e.preventDefault();const s=byId(S.sel);
  setOk(true,'正在派单…');$('#dlgErr').classList.remove('on');
  const fail=S.failNext||/#fail/i.test($('#fNote').value);
  setTimeout(()=>{
    if(fail){S.failNext=false;$('#dlgErr').classList.add('on');setOk(false,'重试派单');$('#fNote').focus();return}
    const id='GD-1112-0'+(S.seq++),who=$('#fWho').value.split(' · ')[1];
    ORDERS.unshift({id,st:s.name,what:$('#fNote').value.split(/[，。,.]/)[0].slice(0,14)||'现场处理',s:'待接单 · '+who});
    const a=s.alarms.find(a=>a.lv!=='info');if(a)a.order=id;
    $('#dlg').close();renderDetail();renderAttn();toast(`已派单 ${id}，${who} 会收到通知`);
  },Q.has('shot')?0:900);
});
let toastT;function toast(t){$('#toastT').textContent=t;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),3200)}

/* ── 时间范围（带面板级加载） ───────────────────────── */
let loadT;
function setRange(r,instant){
  S.range=r;document.querySelectorAll('#range button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r));
  $('#chartSub').textContent=chartModel(r).sub;
  if(instant){apply();return}
  renderKpis(true);$('#chartWrap').classList.add('busy');$('#rows').style.opacity=.45;hideTip();
  clearTimeout(loadT);loadT=setTimeout(apply,480);
}
function apply(){
  S.data=build(S.range);$('#chartWrap').classList.remove('busy');$('#rows').style.opacity='';
  renderKpis();drawChart(S.data.chart);renderTable();renderAttn();if(S.sel)renderDetail();
  const m=S.data.chart;$('#chartNote').innerHTML=m.r==='month'?'<span>柱：实际 · 横线：预测</span><span>浅色柱：低于预测 5% 以上</span><span>最后一根为今天（截至 '+NOW_TXT+'）</span>':'<span>浅红区：实际低于预测</span><span>灰底：尚未发生的时段</span>';
}

/* ── 事件 ───────────────────────────────────────────── */
$('#range').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.r!==S.range)setRange(b.dataset.r)});
$('#filter').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.f;renderFilter();renderTable();$(`#filter [data-f=${S.filter}]`).focus()});
$('#filter').addEventListener('keydown',e=>{if(!/Arrow(Left|Right)/.test(e.key))return;const i=FILTERS.findIndex(f=>f[0]===S.filter),n=(i+(e.key==='ArrowRight'?1:-1)+FILTERS.length)%FILTERS.length;S.filter=FILTERS[n][0];renderFilter();renderTable();$(`#filter [data-f=${S.filter}]`).focus();e.preventDefault()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderTable()});
$('#clearF').onclick=()=>{S.q='';$('#q').value='';S.filter='all';renderFilter();renderTable();$('#q').focus()};
$('#tbl thead').addEventListener('click',e=>{const th=e.target.closest('th[data-k]');if(!th)return;const k=th.dataset.k;
  S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='name'?1:-1};renderTable();th.querySelector('button').focus()});
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){openDetail(o.dataset.open,o);return}
  const tr=e.target.closest('#rows tr');if(tr)openDetail(tr.dataset.id,tr.querySelector('[data-open]'))});
$('#scrim').onclick=closeDetail;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel&&!$('#dlg').open){e.preventDefault();closeDetail()}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawChart(S.data.chart);if(S.sel){drawMini(byId(S.sel));$('#scrim').classList.toggle('on',isNarrow());setInert(isNarrow())}},120)});

/* ── 启动（截图参数：#shot&range=week&sel=dhx&q=…&f=warn&dlg&fail&tip=12） ── */
renderFilter();
if(Q.get('f'))S.filter=Q.get('f'),renderFilter();
if(Q.get('q'))S.q=Q.get('q'),$('#q').value=S.q;
setRange(Q.get('range')||'day',true);
if(Q.get('sel'))openDetail(Q.get('sel'),null);
if(Q.has('dlg'))openDispatch();
if(Q.has('tip'))showTip(+Q.get('tip'));
if(Q.get('at'))scrollTo(0,$('.'+Q.get('at')).getBoundingClientRect().top+scrollY-14);
</script>
</body>
</html>
