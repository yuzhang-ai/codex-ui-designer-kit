<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e6">
<title>漫行 · 城市慢行 App 概念</title>
<style>
:root{
  --paper:#f6f1e6; --card:#fcfaf4; --well:#eee7d8; --well-2:#e6ddca;
  --ink:#1f2c25; --ink-2:#47554c; --muted:#5f695f;
  --moss:#2e4a3a; --moss-2:#5b7a5f; --moss-soft:#dfe6d4; --leaf:#8fa883;
  --persimmon:#c4532c; --persimmon-ink:#ad4320; --persimmon-wash:rgba(196,83,44,.12);
  --stage:#e8e1d2;
  --r-card:28px; --r-block:18px; --r-input:14px; --r-pill:999px;
  --lift:0 1px 2px rgba(58,46,24,.06),0 12px 28px -14px rgba(58,46,24,.26);
  --float:0 -10px 24px -16px rgba(58,46,24,.30);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--moss-2);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:lining-nums tabular-nums}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- 展示台 ---------- */
.stage{min-height:100vh;padding:38px 32px 40px;background:radial-gradient(900px 520px at 50% 0%,#f3eee3 0%,rgba(243,238,227,0) 72%),var(--stage)}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;max-width:1360px;margin:0 auto 26px;padding:0 8px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--moss)}
.brand svg{width:30px;height:30px}
.stage-head h1{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.stage-note{margin:0 0 6px;max-width:23em;font-size:14px;line-height:1.75;color:var(--muted);text-wrap:pretty}
.phones{--z:.78;display:grid;grid-template-columns:repeat(4,auto);justify-content:center;gap:40px 28px}
.slot{display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{width:calc(414px * var(--z,.72));display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--ink-2);padding:0 8px}
.cap b{font-weight:600;color:var(--ink);font-size:15px}
.cap i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:600}

/* ---------- 机身 ---------- */
.phone{zoom:var(--z,.72);width:414px;height:868px;padding:12px;border-radius:66px;position:relative;background:#1c201d;
  box-shadow:inset 0 0 0 1.5px #464c47,inset 0 0 0 5px #121513,0 2px 6px rgba(40,32,18,.14),0 44px 80px -34px rgba(40,32,18,.5)}
.phone::before,.phone::after{content:"";position:absolute;left:-3px;width:3px;border-radius:2px 0 0 2px;background:#2a2f2b}
.phone::before{top:180px;height:60px}.phone::after{top:256px;height:60px}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--paper);isolation:isolate;
  --top:58px;--bottom:26px;--tab:58px}
.island{position:absolute;z-index:40;top:11px;left:50%;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#090a09;pointer-events:none}
.statusbar{position:absolute;z-index:35;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 50px;font-size:16px;font-weight:600;letter-spacing:.01em;pointer-events:none;color:var(--ink)}
.statusbar svg{display:block}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;z-index:45;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--ink);opacity:.82;pointer-events:none}
.scrim{position:absolute;z-index:34;top:0;left:0;right:0;height:calc(var(--top) + 8px);background:linear-gradient(var(--paper) 62%,rgba(246,241,230,0));opacity:0;pointer-events:none;transition:opacity .2s}
.screen.scrolled .scrim{opacity:1}
[data-focus]:focus,[data-focus]:focus-visible{outline:none}

/* ---------- App 外壳 ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.viewport{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.view{min-height:100%;padding:calc(var(--top) + 6px) 20px calc(var(--bottom) + var(--tab) + 28px);animation:viewIn .32s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabbar{position:absolute;z-index:20;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--bottom));padding:6px 10px var(--bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#f9f5ec;box-shadow:var(--float)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.04em}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--moss);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.1}
.tab .live{position:absolute;top:5px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--persimmon);box-shadow:0 0 0 2px #f9f5ec}

.toast{position:absolute;z-index:30;left:50%;top:calc(var(--top) + 4px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100% - 40px);padding:10px 16px 10px 12px;border-radius:var(--r-pill);background:var(--moss);color:#f6f1e6;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--lift);transition:opacity .2s,transform .3s var(--ease)}
.toast svg{width:18px;height:18px;flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 图标 */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 通用 */
.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;font-size:17px;font-weight:600}
.h-sec small{font-size:13px;font-weight:400;color:var(--muted)}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 24px;border-radius:var(--r-pill);background:var(--moss);color:#f7f2e7;font-size:17px;font-weight:600;letter-spacing:.06em;box-shadow:0 1px 1px rgba(30,48,38,.2),0 10px 22px -10px rgba(30,48,38,.55);transition:transform .15s var(--ease),background .2s,opacity .2s}
.btn-primary:active{transform:scale(.98)}
.btn-primary small{font-size:13px;font-weight:400;letter-spacing:0;opacity:.78}
.btn-primary[disabled],.btn-primary[aria-disabled="true"]{background:#a5ad9f;box-shadow:none;cursor:not-allowed}
.btn-round{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:var(--lift)}
.btn-round[aria-pressed="true"]{color:var(--persimmon-ink)}
.btn-round[aria-pressed="true"] .ic{fill:currentColor}
.demo-note{margin:34px 0 0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em}

/* ---------- 今日 ---------- */
.t-date{margin:8px 0 6px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.t-greet{margin:0;font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.32;letter-spacing:.02em}
.t-weather{display:flex;align-items:center;gap:7px;margin:12px 0 0;font-size:14px;color:var(--ink-2)}
.t-weather .ic{width:20px;height:20px;color:var(--moss-2)}
.resume{display:flex;align-items:center;gap:12px;width:100%;margin:20px 0 0;padding:8px 14px 8px 8px;min-height:60px;border-radius:var(--r-pill);background:var(--well);text-align:left;transition:background .2s}
.resume:hover{background:var(--well-2)}
.resume .ring{width:44px;height:44px;flex:none}
.resume span{display:block;font-size:12px;color:var(--muted)}
.resume b{display:block;font-size:15px;font-weight:600;margin-top:1px}
.resume .ic{margin-left:auto;color:var(--muted)}
.feature{display:block;width:100%;margin:16px 0 0;padding:8px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--lift);text-align:left;transition:transform .2s var(--ease)}
.feature:active{transform:scale(.985)}
.feature .art{position:relative;display:block;height:232px;border-radius:20px;overflow:hidden;background:var(--well)}
.feature .art svg{display:block;width:100%;height:100%}
.chip-on-art{position:absolute;left:12px;top:12px;padding:6px 11px;border-radius:var(--r-pill);background:rgba(252,250,244,.94);font-size:12px;font-weight:600;color:var(--moss);letter-spacing:.04em}
.feature .body{display:flex;align-items:center;gap:12px;padding:16px 8px 8px 10px}
.feature .name{display:block;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.03em}
.feature .meta{display:block;margin-top:6px;font-size:13px;color:var(--ink-2)}
.feature .go{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--moss-soft);color:var(--moss);flex:none}
.rail{display:flex;gap:12px;margin:0 -20px;padding:0 20px 6px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;scroll-snap-align:start;text-align:left;border-radius:var(--r-block)}
.mini .art{display:block;height:112px;border-radius:var(--r-block);overflow:hidden;background:var(--well)}
.mini .art svg{display:block;width:100%;height:100%}
.mini .name{display:block;margin:10px 2px 0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em}
.mini .meta{display:block;margin:4px 2px 0;font-size:12px;color:var(--muted)}

/* ---------- 路线详情 ---------- */
.view.route{padding-top:0;padding-left:0;padding-right:0}
.map-hero{position:relative;height:var(--map-h,336px);background:#e9e0cc}
.map-hero svg.map{display:block;width:100%;height:100%}
.map-top{position:absolute;left:16px;right:16px;top:calc(var(--top) + 2px);display:flex;justify-content:space-between}
.sheet{position:relative;margin-top:-30px;padding:26px 20px 0;border-radius:var(--r-card) var(--r-card) 0 0;background:var(--paper)}
.r-area{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.r-name{margin:6px 0 0;font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.03em}
.r-tag{margin:8px 0 0;text-wrap:pretty;font-size:15px;line-height:1.6;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 0;padding:14px 4px;border-radius:var(--r-block);background:var(--well)}
.stat{padding:0 12px}
.stat+.stat{box-shadow:-1px 0 0 rgba(70,60,40,.1)}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.stat .v small{margin-left:3px;font-size:13px;font-weight:500;color:var(--ink-2)}
.stat .k{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12px;color:var(--muted)}
.stat .k .ic{width:14px;height:14px}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:0 14px;width:100%;padding:0 0 18px;text-align:left;position:relative;border-radius:14px}
.stops li:not(:last-child) .stop::before{content:"";position:absolute;left:14px;top:34px;bottom:2px;border-left:2px dotted #b9c3ab}
.stop .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--moss-soft);color:var(--moss);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.stop[aria-pressed="true"] .n{background:var(--persimmon);color:#fff;box-shadow:0 0 0 5px var(--persimmon-wash)}
.stop .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:30px;letter-spacing:.02em}
.stop .d{grid-column:2;margin-top:2px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.stop .m{grid-row:1;grid-column:3;font-size:12px;line-height:30px;color:var(--muted);font-variant-numeric:tabular-nums}
.cta-bar{position:sticky;z-index:5;bottom:calc(var(--bottom) + var(--tab));margin:6px 0 0;padding:18px 0 14px;background:linear-gradient(to top,var(--paper) 72%,rgba(246,241,230,0))}

/* ---------- 漫行中 ---------- */
.w-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-top:2px}
.w-state{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--persimmon-ink);letter-spacing:.06em}
.w-state .dot{width:8px;height:8px;border-radius:50%;background:var(--persimmon);animation:breathe 1.8s ease-in-out infinite}
.w-state.paused{color:var(--muted)}
.w-state.paused .dot{background:var(--muted);animation:none}
@keyframes breathe{50%{transform:scale(.6);opacity:.55}}
.w-route{margin:2px 0 0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.03em}
.w-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.w-count b{font-size:17px;color:var(--ink);font-weight:600}
.w-map{position:relative;height:226px;margin:14px 0 0;border-radius:var(--r-block);overflow:hidden;background:#e9e0cc}
.w-map svg{display:block;width:100%;height:100%}
.next{position:relative;margin:14px 0 0;padding:20px 20px 18px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--lift);overflow:hidden}
.next .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--persimmon-ink);letter-spacing:.04em}
.next .lbl .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--persimmon);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.next .nm{margin:10px 0 0;font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.04em;line-height:1.25}
.next .far{margin:6px 0 0;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.next .look{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-input);background:var(--well);font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--ink)}
.next .look b{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--moss-2);margin-right:6px;letter-spacing:.04em}
.next.advance .swap{animation:swapIn .5s var(--ease) both}
@keyframes swapIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:16px 4px 0}
.meter .v{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;transition:opacity .2s}
.meter .v small{margin-left:3px;font-size:14px;font-weight:500;color:var(--ink-2)}
.meter .k{margin-top:2px;font-size:12px;color:var(--muted)}
.paused-v .meter:first-child .v{opacity:.45}
.controls{display:flex;gap:12px;align-items:center;margin:18px 0 0}
.controls .btn-round{width:56px;height:56px;flex:none;background:var(--well);box-shadow:none;color:var(--moss)}
.controls .btn-round .ic{width:24px;height:24px}
.arrive{position:relative;flex:1;overflow:visible}
.arrive .ripple{position:absolute;inset:0;border-radius:var(--r-pill);pointer-events:none;box-shadow:0 0 0 0 rgba(196,83,44,.55)}
.arrive.hit{animation:press .42s var(--ease)}
.arrive.hit .ripple{animation:ripple .7s ease-out}
@keyframes press{0%{transform:scale(1)}30%{transform:scale(.95)}65%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes ripple{from{box-shadow:0 0 0 0 rgba(196,83,44,.5)}to{box-shadow:0 0 0 18px rgba(196,83,44,0)}}
.hint{min-height:20px;margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.pos-pulse{transform-box:fill-box;transform-origin:center;animation:pos 2s ease-out infinite}
@keyframes pos{from{transform:scale(.6);opacity:.55}to{transform:scale(2.2);opacity:0}}
.done-card,.idle-card{margin:16px 0 0;padding:24px 20px 20px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--lift)}
.done-card h2,.idle-card h2{margin:0;font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.04em}
.done-card p,.idle-card p{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.done-card .stats{background:var(--well)}
.done-card .btn-primary,.idle-card .btn-primary{margin-top:20px}

/* ---------- 手记 ---------- */
.j-title{margin:8px 0 0;font-family:var(--serif);font-size:31px;font-weight:600;letter-spacing:.04em}
.j-sub{margin:6px 0 0;font-size:14px;color:var(--muted)}
.walked{display:flex;gap:14px;align-items:center;margin:18px 0 0;padding:10px 16px 10px 10px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--lift)}
.walked .trace{width:88px;height:88px;flex:none;border-radius:var(--r-block);overflow:hidden;background:#ece4d2}
.walked .trace svg{display:block;width:100%;height:100%}
.walked .nm{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.03em}
.walked .mt{margin-top:6px;font-size:13px;line-height:1.5;color:var(--ink-2);font-variant-numeric:tabular-nums}
.walked .ticks{display:flex;gap:5px;margin-top:9px}
.walked .ticks i{width:16px;height:4px;border-radius:2px;background:var(--persimmon)}
.composer{margin:26px 0 0}
.composer label.q{display:block;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.composer .field{position:relative;margin:12px 0 0}
.composer textarea{display:block;width:100%;min-height:128px;resize:none;padding:14px 16px 30px;border:0;border-radius:var(--r-input);background:var(--well);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.75;transition:background .2s,box-shadow .2s}
.composer textarea::placeholder{color:#8a8f84}
.composer textarea:focus{outline:none;background:var(--card);box-shadow:0 0 0 2px var(--moss-2)}
.composer textarea[readonly]{opacity:.7}
.count{position:absolute;right:14px;bottom:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.moods-l{margin:16px 0 8px;font-size:13px;color:var(--muted)}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:var(--r-pill);background:var(--well);color:var(--ink-2);font-size:14px;transition:background .2s,color .2s}
.mood .ic{width:16px;height:16px;display:none;stroke-width:2.2}
.mood[aria-pressed="true"]{background:var(--moss-soft);color:var(--moss);font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(46,74,58,.35)}
.mood[aria-pressed="true"] .ic{display:block}
.composer .btn-primary{margin-top:20px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(247,242,231,.35);border-top-color:#f7f2e7;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:flex-start;gap:8px;min-height:22px;margin:12px 2px 0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.status:empty{display:none}
.status .ic{width:18px;height:18px;margin-top:1px}
.status.ok{color:var(--moss)}
.status.err{color:var(--persimmon-ink);padding:10px 8px 10px 12px;margin-left:0;margin-right:0;border-radius:var(--r-input);background:var(--persimmon-wash);align-items:center}
.status .retry{margin-left:auto;flex:none;min-height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--persimmon-wash);color:var(--persimmon-ink);font-weight:600;font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;padding:22px 20px 8px;text-align:center}
.empty svg{width:96px;height:72px}
.empty p{margin:12px 0 0;font-size:14px;line-height:1.65;color:var(--muted)}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.entry{padding:16px 18px;border-radius:var(--r-block);background:var(--card);box-shadow:var(--lift);animation:viewIn .4s var(--ease) both}
.entry p{margin:0;font-family:var(--serif);font-size:16px;line-height:1.75;text-wrap:pretty}
.entry .em{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.entry .em span{padding:3px 9px;border-radius:var(--r-pill);background:var(--moss-soft);color:var(--moss);font-weight:600}

/* ---------- 断点 ---------- */
@media (max-width:1099px){
  .stage{padding:40px 32px 48px}
  .stage-head{flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:32px;max-width:720px}
  .stage-note{text-align:left}
  .phones{--z:.72;grid-template-columns:repeat(2,auto);gap:40px 28px}
}
@media (max-width:599px){
  body{background:var(--paper)}
  .stage{padding:0;background:none}
  .stage-head,.cap,.slot:not(:first-child){display:none}
  .phones{display:block}
  .slot{display:block}
  .phone{zoom:1;width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none}
  .phone::before,.phone::after,.island,.statusbar,.homebar{display:none}
  .scrim{height:calc(var(--top) + 4px)}
  .screen{--map-h:300px;width:100%;height:100%;border-radius:0;--top:max(14px,env(safe-area-inset-top));--bottom:max(8px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .pos-pulse{display:none}
}
.shot *,.shot *::before,.shot *::after{animation:none!important;transition:none!important}
.shot .pos-pulse{display:none}
