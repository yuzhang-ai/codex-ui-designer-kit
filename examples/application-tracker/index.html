<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投递手记 · 我的求职记录</title>
<style>
:root{--paper:#f5f6f2;--surface:#fff;--ink:#202e2a;--muted:#626e67;--line:#dfe5de;--green:#256047;--tint:#edf4ed;--error:#a13429;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 17px;font-weight:600}button:hover{background:var(--tint)}button:disabled{cursor:not-allowed;opacity:.55}button.primary{background:var(--green);border-color:var(--green);color:white}button.primary:hover{background:#184d37}:focus-visible{outline:3px solid #d29639;outline-offset:3px}header{border-bottom:1px solid var(--line);background:var(--surface)}.topbar{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:19px 32px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--green);color:white;border-radius:10px;font-size:19px}.local{color:var(--muted);font-size:13px}.local:before{content:'●';color:var(--green);font-size:10px;margin-right:7px}main{max-width:1200px;margin:auto;padding:46px 32px 28px}.heading{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700;margin:0 0 9px}h1{font-size:30px;letter-spacing:-1px;line-height:1.3;margin:0 0 9px}p{margin:0}.intro{color:var(--muted)}.workspace{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:5px;flex-wrap:wrap}.filter{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-size:14px}.filter[aria-pressed=true]{background:var(--tint);color:var(--green)}.filter span{font-size:12px;margin-left:7px;font-weight:400}.search{position:relative;max-width:330px;width:100%}.search input{padding-left:37px}.search-icon{position:absolute;left:13px;top:10px;color:var(--muted)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c9d3c9;border-radius:8px;background:#fff;color:var(--ink);min-height:46px}input::placeholder,textarea::placeholder{color:#7b847e}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;background:#fafbf8;padding:13px 24px}td{padding:22px 24px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.company{font-weight:700;font-size:16px}.role{font-size:14px;color:var(--muted);margin-top:4px}.note{color:#505f55;white-space:pre-wrap;font-size:14px}.badge{display:inline-block;border-radius:6px;padding:4px 9px;white-space:nowrap;font-size:12px;font-weight:600;background:#eef0eb;color:#55634f}.badge.sent{background:#eef2fd;color:#375b9c}.badge.interview{background:#ecf5ec;color:#32673a}.edit-button{white-space:nowrap;min-height:44px;padding:6px 12px;font-size:13px;border-color:transparent;color:var(--green)}.empty{padding:65px 24px 70px;text-align:center}.empty-icon{margin:0 auto 20px;width:54px;height:62px;border:1px solid #cad8c9;border-radius:9px;background:var(--tint);display:grid;place-items:center;font-size:27px;color:var(--green);transform:rotate(-7deg)}.empty h2{font-size:20px;margin:0 0 8px}.empty p{color:var(--muted);margin-bottom:22px}.list-footer{padding:14px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.footnote{font-size:12px;color:var(--muted);margin:22px 0;line-height:1.8}.feedback:not(:empty){margin-bottom:18px;padding:12px 16px;border:1px solid #c6ddc7;border-radius:9px;background:var(--tint);color:var(--green)}.feedback.error:not(:empty){background:#fff1ee;border-color:#e9bdb5;color:var(--error)}dialog{width:min(540px,calc(100% - 32px));max-height:90dvh;padding:0;border:1px solid var(--line);border-radius:16px;color:var(--ink);box-shadow:0 22px 80px #102a2226}dialog::backdrop{background:#18282066}.dialog-head{padding:24px 26px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}h2{font-size:23px;margin:0 0 4px}.dialog-head p{font-size:13px;color:var(--muted)}.close{border:0;padding:0;width:40px;min-height:40px;font-size:23px;color:var(--muted)}form{padding:0 26px 24px}.fields{display:grid;gap:17px}label{display:block;font-size:14px;font-weight:600}label input,label select,label textarea{margin-top:7px;font-weight:400}label small{font-size:12px;font-weight:400;color:var(--muted)}textarea{resize:vertical;min-height:108px}.form-actions{margin-top:24px;display:flex;justify-content:flex-end;gap:10px}.form-feedback{font-size:13px;color:var(--error);margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}tr:hover td{background:#fdfefb}
@media(max-width:850px){.toolbar{align-items:stretch;flex-direction:column;gap:12px}.search{max-width:none}th,td{padding-left:18px;padding-right:18px}main{padding-top:32px}}
@media(max-width:600px){.topbar{padding:16px 20px}.local{font-size:11px}.brand{font-size:17px;gap:8px}main{padding:28px 16px 20px}.heading{gap:16px;align-items:flex-start;flex-direction:column;margin-bottom:24px}h1{font-size:27px}.intro{font-size:14px}.heading>.primary{width:100%}.toolbar{padding:15px}.filters{gap:0;justify-content:space-between}.filter{padding:7px 9px;font-size:13px}.filter span{margin-left:4px}table,tbody{display:block}thead{display:none}tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:18px;gap:12px;border-top:1px solid var(--line)}td{display:block;border:0;padding:0}td:first-child{grid-column:1;grid-row:1}td:nth-child(2){grid-column:2;grid-row:1}td:nth-child(3){grid-column:1/-1;grid-row:2}td:last-child{grid-column:1/-1;grid-row:3;text-align:right}.note{line-height:1.7}.list-footer{padding:14px 18px;flex-wrap:wrap}.empty{padding:40px 20px}.dialog-head{padding:22px 20px 16px}form{padding:0 20px 20px}.form-actions button{flex:1}dialog{max-height:94dvh}.footnote{margin:16px 2px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(min-width:641px) and (max-width:900px){td:last-child,th:last-child{padding-left:8px;padding-right:8px}}
</style></head><body>
<header><div class="topbar"><div class="brand"><span class="mark" aria-hidden="true">↗</span>投递手记</div><span class="local">浏览器本地保存</span></div></header>
<main><div class="heading"><div><p class="eyebrow">MY APPLICATIONS</p><h1>每一步，都有记录。</h1><p class="intro">整理心仪岗位，跟进每一次机会。</p></div><button class="primary" id="new">＋ 新增投递</button></div>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<section class="workspace" aria-label="投递记录"><div class="toolbar"><div class="filters" role="group" aria-label="按投递状态筛选"></div><div class="search"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="search">搜索公司、岗位或备注</label><input id="search" type="search" placeholder="搜索公司、岗位或备注" autocomplete="off"></div></div>
<table aria-label="我的投递记录"><colgroup><col style="width:34%"><col style="width:15%"><col style="width:39%"><col style="width:12%"></colgroup><thead><tr><th scope="col">公司 / 岗位</th><th scope="col">进展</th><th scope="col">备注</th><th scope="col">操作</th></tr></thead><tbody id="rows"></tbody></table>
<div class="empty" id="empty"><div class="empty-icon" aria-hidden="true">↗</div><h2 id="empty-title">从一个心仪岗位开始</h2><p id="empty-text">记下公司和岗位，为下一次行动留个线索。</p><button id="empty-action" class="primary">新增第一条投递</button></div>
<div class="list-footer"><span id="count">共 0 条记录</span><span>记录进展，按自己的节奏前行</span></div></section>
<p class="footnote">数据仅保存在当前浏览器，不会上传。清除浏览器数据会丢失记录；切换浏览器、设备或页面地址不会自动同步。</p></main>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><div><h2 id="editor-title">新增投递</h2><p>先记下来，进展和备注可以随时更新。</p></div><button type="button" class="close" id="close" aria-label="关闭编辑">×</button></div><form id="form"><div class="fields"><label for="company">公司 <small>必填</small><input id="company" name="company" required autocomplete="organization" placeholder="例如：心仪的公司"></label><label for="role">岗位 <small>必填</small><input id="role" name="role" required placeholder="例如：产品经理"></label><label for="status">当前进展<select id="status" name="status"><option>待投递</option><option>已投递</option><option>面试中</option></select></label><label for="note">备注 <small>可选</small><textarea id="note" name="note" placeholder="记下面试准备、沟通进展或下一步计划…"></textarea></label></div><p id="form-feedback" class="form-feedback" role="alert"></p><div class="form-actions"><button type="button" id="cancel">取消</button><button class="primary" id="save" type="submit">保存记录</button></div></form></dialog>
<script>
'use strict';
const key='uikit-job-demo-v1';
const $=id=>document.getElementById(id);
const fields=['company','role','status','note'];
let data=[],edit=null,active='全部',snapshot='',opener=null,readFailed=false;
function announce(message,error=false){$('feedback').textContent=message;$('feedback').classList.toggle('error',error)}
function readData(){try{const raw=localStorage.getItem(key);const parsed=raw?JSON.parse(raw):[];if(!Array.isArray(parsed)||parsed.some(x=>!x||typeof x.id!=='string'||fields.some(k=>typeof x[k]!=='string')))throw Error('format');data=parsed;readFailed=false}catch(error){readFailed=true;announce('本地记录暂时无法读取。为保护原数据，已暂停保存；请恢复浏览器存储权限或检查原数据后刷新页面。',true)}$('new').disabled=readFailed;draw()}
function draw(){
 const q=$('search').value.trim().toLocaleLowerCase();
 const shown=data.filter(x=>(active==='全部'||x.status===active)&&[x.company,x.role,x.note].some(v=>v.toLocaleLowerCase().includes(q)));
 const group=document.querySelector('.filters');
 if(!group.children.length)['全部','待投递','已投递','面试中'].forEach(s=>{const b=document.createElement('button');b.className='filter';b.type='button';b.dataset.status=s;b.onclick=()=>{active=s;draw()};group.append(b)});
 [...group.children].forEach(b=>{const s=b.dataset.status;b.setAttribute('aria-pressed',String(s===active));b.textContent=s;const n=document.createElement('span');n.textContent=s==='全部'?data.length:data.filter(x=>x.status===s).length;b.append(n)});
 $('rows').replaceChildren();shown.forEach(x=>{const tr=document.createElement('tr');const identity=document.createElement('td');const company=document.createElement('div');company.className='company';company.textContent=x.company;const role=document.createElement('div');role.className='role';role.textContent=x.role;identity.append(company,role);const status=document.createElement('td');const badge=document.createElement('span');badge.className='badge'+(x.status==='已投递'?' sent':x.status==='面试中'?' interview':'');badge.textContent=x.status;status.append(badge);const note=document.createElement('td');note.className='note';note.textContent=x.note||'还没有备注';const action=document.createElement('td');const b=document.createElement('button');b.type='button';b.className='edit-button';b.textContent='编辑';b.setAttribute('aria-label','编辑 '+x.company+' '+x.role);b.onclick=()=>openEditor(x,b);action.append(b);tr.append(identity,status,note,action);$('rows').append(tr)});
 $('empty').hidden=shown.length>0;$('empty-title').textContent=readFailed?'暂时无法读取记录':data.length?'没有找到匹配的记录':'从一个心仪岗位开始';$('empty-text').textContent=readFailed?'原始存储未被改写，请处理上方提示后刷新。':data.length?'换个关键词，或清除筛选查看全部记录。':'记下公司和岗位，为下一次行动留个线索。';$('empty-action').textContent=data.length?'清除搜索与筛选':'新增第一条投递';$('empty-action').disabled=readFailed;$('count').textContent=(q||active!=='全部')?'显示 '+shown.length+' / '+data.length+' 条记录':'共 '+data.length+' 条记录';
}
function formValue(){return JSON.stringify(fields.map(k=>$(k).value))}
function openEditor(item,trigger){opener=trigger;edit=item?item.id:null;$('form').reset();const extra=$('status').querySelector('[data-legacy]');if(extra)extra.remove();if(item){if(![...$('status').options].some(o=>o.value===item.status)){const option=document.createElement('option');option.value=item.status;option.textContent=item.status;option.dataset.legacy='true';$('status').append(option)}fields.forEach(k=>$(k).value=item[k])}$('editor-title').textContent=item?'编辑投递':'新增投递';$('save').textContent=item?'保存修改':'保存记录';$('form-feedback').textContent='';snapshot=formValue();$('editor').showModal();$('company').focus()}
function closeEditor(){if(formValue()!==snapshot&&!confirm('还有未保存的修改，确定放弃吗？'))return;$('editor').close()}
$('editor').addEventListener('close',()=>{if(opener&&opener.isConnected)opener.focus();else $('new').focus()});
$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
$('editor').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...$('editor').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')];const first=controls[0],last=controls[controls.length-1];if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
$('new').onclick=()=>openEditor(null,$('new'));$('empty-action').onclick=()=>{if(data.length){$('search').value='';active='全部';draw();$('search').focus()}else openEditor(null,$('empty-action'))};$('cancel').onclick=closeEditor;$('close').onclick=closeEditor;$('search').oninput=draw;
$('form').onsubmit=e=>{e.preventDefault();if(readFailed)return;for(const k of ['company','role']){if(!$(k).value.trim()){$('form-feedback').textContent=(k==='company'?'公司':'岗位')+'不能为空，请填写后再保存。';$(k).focus();return}}
 const item={...(edit?data.find(x=>x.id===edit):{}),id:edit||(globalThis.crypto?.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))};fields.forEach(k=>item[k]=$(k).value.trim());const next=edit?data.map(x=>x.id===edit?item:x):[...data,item];const save=$('save');save.disabled=true;
 try{localStorage.setItem(key,JSON.stringify(next));data=next;const verb=edit?'修改已保存':'投递已添加';draw();snapshot=formValue();$('editor').close();const hidden=(active!=='全部'&&item.status!==active)||!([item.company,item.role,item.note].some(v=>v.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase())));announce(verb+'：'+item.company+' · '+item.role+(hidden?'。当前筛选未显示此记录，清除筛选后可查看。':'。'))}catch(error){$('form-feedback').textContent='保存失败，输入已保留。请检查浏览器存储权限或可用空间后再次保存。'}finally{save.disabled=false}
};
readData();
</script></body></html>
