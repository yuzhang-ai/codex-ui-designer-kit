<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投递记录demo</title><style>body{font-family:sans-serif;background:#eee}label{display:block}input,textarea{width:300px}table{width:1100px}td{border:1px solid gray}button{background:yellow}</style><h1>投递记录demo</h1><p>仅当前浏览器本地记录，示例公司为虚构。</p><form id="form"><label>公司<input id="company" required></label><label>岗位<input id="role" required></label><label>状态<select id="status"><option>待投递</option><option>已投递</option><option>面试中</option></select></label><label>备注<textarea id="note"></textarea></label><button>保存</button><button type="button" id="new">新建</button></form><p id="feedback"></p><label>搜索<input id="search"></label><table><thead><tr><th>公司</th><th>岗位</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><script>
const key='uikit-job-demo-v1';let data=JSON.parse(localStorage.getItem(key)||'[]'),edit=null;const $=id=>document.getElementById(id);function draw(){ $('rows').replaceChildren(); data.filter(x=>(x.company+x.role+x.note).includes($('search').value)).forEach(x=>{let tr=document.createElement('tr');['company','role','status','note'].forEach(k=>{let td=document.createElement('td');td.textContent=x[k];tr.append(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='编辑';b.onclick=()=>{edit=x.id;['company','role','status','note'].forEach(k=>$(k).value=x[k]);};td.append(b);tr.append(td);$('rows').append(tr)})} $('form').onsubmit=e=>{e.preventDefault();let item={id:edit||crypto.randomUUID()};['company','role','status','note'].forEach(k=>item[k]=$(k).value);if(edit)data=data.map(x=>x.id===edit?item:x);else data.push(item);localStorage.setItem(key,JSON.stringify(data));$('feedback').textContent='已保存';edit=null;$('form').reset();draw()};$('new').onclick=()=>{edit=null;$('form').reset()};$('search').oninput=draw;draw();</script></html>
