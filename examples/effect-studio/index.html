<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 效果体验室 · UI Designer Kit</title>
<style>
:root{--paper:#f4f2ec;--ink:#202923;--muted:#59635c;--line:#d1d7cc;--green:#284b3b;--accent:#dce8b8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #617d40;outline-offset:4px}header{max-width:1240px;margin:auto;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:16px}.brand{font-size:13px;letter-spacing:2px;font-weight:700}.tag{font-size:12px;color:var(--muted)}main{max-width:1240px;margin:auto;padding:40px 32px 32px}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.2;margin:8px 0 16px;font-weight:650}h2,h3,p{margin-top:0}.intro{max-width:740px;color:var(--muted);margin-bottom:28px}.layout{display:grid;grid-template-columns:330px 1fr;gap:28px}nav{display:grid;gap:8px}nav button{border:1px solid var(--line);border-radius:10px;text-align:left;background:transparent;padding:15px 18px}nav button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}nav small{display:block;opacity:.8;font-size:12px;margin-top:3px}.explain{margin-top:24px;font-size:14px}.explain h2{font-size:17px;margin-bottom:10px}.choices{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.choice{border:1px solid var(--line);padding:8px 13px;border-radius:6px;background:white;font-size:14px}.choice[aria-pressed=true]{background:var(--accent);border-color:#7a9258}.viewer{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.viewer-top{padding:15px 23px;background:#e9ede4;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:12px}.canvas{padding:28px;min-height:350px}.scene{min-height:260px}.notebook{border-top:3px solid var(--green);padding-top:22px;max-width:620px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:2px}.notebook h3{font:500 29px/1.35 Georgia,"Songti SC",SimSun,serif;margin:9px 0 18px}.copy{line-height:1.95;color:#46534a}.line{height:12px;background:#e3e8df;border-radius:3px;margin:14px 0;width:95%}.line.short{width:63%}.skeleton{animation:breathe 1.6s ease-in-out infinite}.status{display:flex;align-items:center;gap:12px;padding:22px;background:#edf1e8;border-radius:10px}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);animation:breathe 1.2s infinite;flex:none}.toolbar{border-top:1px solid var(--line);padding:18px 24px;display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary{border:1px solid var(--line);border-radius:6px;padding:9px 15px;font-size:14px}.primary{background:var(--green);color:white;border-color:var(--green)}.secondary{background:#fff}.note{padding:0 24px 20px;font-size:12px;color:var(--muted)}.detail{padding:22px;background:#f5f5ef;border-left:3px solid #6b8553}.note-card{padding:20px;border:1px solid var(--line);border-radius:8px;max-width:430px}.note-card strong{display:block;font-size:21px;margin:6px 0}.saved{padding:16px;border-left:3px solid #517940;background:#edf3e6}.readmode{max-width:35em;margin:auto}.readmode.sans h3{font:650 25px/1.4 system-ui}.readmode.sans .copy{line-height:1.7}.readmode.mag h3{font-size:36px}.error{background:#fff0e8;border-left:3px solid #9a4f25;padding:20px}footer{margin:26px 0 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}label{display:flex;align-items:center;gap:8px}input{width:18px;height:18px}.contract{font-size:13px;color:var(--muted);margin:20px 0 0}.fade{animation:appear .22s ease-out}.slide{animation:slide .24s ease-out}@keyframes breathe{50%{opacity:.4}}@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}.reduce *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){header{padding:20px}.tag{display:none}main{padding:28px 20px}.layout{grid-template-columns:1fr;gap:20px}nav{grid-template-columns:1fr 1fr}nav button{padding:12px;font-size:14px}.canvas{padding:22px;min-height:300px}.viewer-top{padding:13px 18px}.readmode.mag h3{font-size:28px}h1{letter-spacing:-1px}.intro{font-size:14px}.toolbar{padding:16px}footer{margin-top:20px}}
</style></head><body>
<header><div class="brand">UI DESIGNER KIT / 效果体验室</div><div class="tag">先说感觉，再看效果。</div></header>
<main><div class="eyebrow">DESIGN, IN YOUR WORDS</div><h1>不用知道名字，<br>也能说清你想要的效果。</h1><p class="intro">从一句日常描述开始。看看两种方案有什么不同，再决定你的页面该怎么做。这里的笔记与运行状态均为本地模拟。</p>
<div class="layout"><aside><nav aria-label="选择体验场景"><button data-case="wait" aria-pressed="true">01　生成时别空着<small>等待反馈 / Loading</small></button><button data-case="transition" aria-pressed="false">02　打开详情别太生硬<small>页面切换 / Transition</small></button><button data-case="type" aria-pressed="false">03　像一本安静的杂志<small>阅读排版 / Typography</small></button><button data-case="feedback" aria-pressed="false">04　保存了要让我知道<small>操作反馈 / Feedback</small></button></nav><section class="explain" aria-live="polite"><h2 id="recommend"></h2><p id="reason"></p><div class="choices" id="choices"></div><p id="tradeoff"></p></section></aside>
<section class="viewer" aria-label="效果预览"><div class="viewer-top"><span>纸间 · AI 笔记示例</span><span id="current">骨架屏</span></div><div class="canvas"><div id="scene" class="scene" aria-live="polite"></div></div><div class="toolbar" id="actions"></div><p id="state" class="note" role="status"></p></section></div>
<p class="contract" id="contract"></p><footer><label><input type="checkbox" id="reduce">减少动态效果</label><span>无账号 · 无网络请求 · 不保存输入 · 不连接模型</span></footer></main>
<script>
const $=id=>document.getElementById(id);let active='wait',variant=0,phase='idle';
const data={wait:{title:'让等待有信息，而不是只让画面动。',reason:'已知内容结构时，先显示笔记轮廓；长任务且进度未知时，用局部状态说明系统仍在处理。',choices:['先看内容轮廓','显示任务状态'],names:['骨架屏 / Skeleton','局部状态 / Inline status'],trade:'推荐按数据形态选择。没有真实进度时，不显示假百分比，也不编造模型思考过程。',spec:'触发：真实请求开始。结束：真实成功、失败或取消。减少动态效果时保留静态轮廓和状态文字。'},transition:{title:'保持上下文，让详情自然出现。',reason:'淡入比较安静；侧滑更像从列表旁边打开一层。内容相同，可以直接比较。',choices:['安静淡入','轻轻侧滑'],names:['淡入 / Fade','侧滑 / Slide'],trade:'阅读产品优先淡入。侧滑能表达空间关系，但不适合在频繁切换时反复大幅移动。',spec:'本例：淡入 220ms / 侧滑 240ms、16px。只是可调整起点；减少动态效果时立即出现。'},type:{title:'杂志感，首先来自排版秩序。',reason:'保持同一篇内容，比较编辑式标题与留白，和紧凑、直接的工具式排版。',choices:['编辑式阅读','紧凑工具式'],names:['编辑式排版 / Editorial','紧凑排版 / Compact'],trade:'这不是全站换一种字体。标题可以有气质，正文与操作保持易读，中文字体不可用时自然回退。',spec:'本例只改变标题字阶、字体与阅读节奏；不改变内容，也不让正文持续移动。'},feedback:{title:'完成反馈要来自真实结果。',reason:'保存成功后在操作附近确认；重要提示可以保留，避免一闪就错过。',choices:['保留就地提示','更新按钮状态'],names:['就地确认 / Inline confirmation','按钮状态 / Button state'],trade:'示例需要手动触发模拟结果。生产中须绑定真实保存响应；失败时保留恢复入口。',spec:'成功、失败、重新尝试均可体验。颜色配合文字表达状态；减少动态效果不影响反馈。'}};
const note='<article class="notebook"><div class="eyebrow">FIELD NOTES / 001</div><h3>让想法，慢慢变得清楚。</h3><p class="copy">好的笔记并不急着给出答案。它先留下观察，再连接问题，让零散的想法逐渐形成自己的秩序。</p><p class="copy">阅读时，界面应该安静；行动时，反馈应该清楚。</p></article>';
function button(text,fn,primary=false){let b=document.createElement('button');b.className=primary?'primary':'secondary';b.textContent=text;b.onclick=fn;return b}
function act(text,next,primary=false){$('actions').append(button(text,()=>{phase=next;renderScene();document.querySelector("#actions button")?.focus()},primary))}
function renderScene(){let sc=$('scene');sc.className='scene';$('actions').replaceChildren();$('state').textContent='';
if(active==='wait'){
 if(phase==='running'){sc.innerHTML=variant===0?'<div class="notebook"><div class="eyebrow">正在生成笔记 · 模拟</div><div class="skeleton" aria-hidden="true"><div class="line short"></div><div class="line"></div><div class="line"></div><div class="line short"></div></div></div>':'<div class="status"><span class="dot" aria-hidden="true"></span><div><strong>请求处理中 · 模拟</strong><br><small>尚未收到结果，可以取消。</small></div></div>';act('模拟成功','done',true);act('模拟失败','error');act('取消','cancelled');$('state').textContent='这是等待样例，不会自动假装完成。请选择一个模拟结果。'}
 else if(phase==='done'){sc.innerHTML=note;sc.classList.add('fade');act('重新体验','running',true);$('state').textContent='已展示模拟结果；没有调用模型。'}
 else if(phase==='error'){sc.innerHTML='<div class="error"><strong>这次未能生成 · 模拟失败</strong><p>模拟失败状态已停止等待，可以重试。</p></div>';act('重试','running',true)}
 else{sc.innerHTML=phase==='cancelled'?'<div class="status">本地模拟已取消，没有结果写入。</div>':note;act('体验生成等待','running',true);$('state').textContent='点击开始后比较两种等待反馈。'}
}else if(active==='transition'){
 if(phase==='open'){sc.innerHTML='<div class="detail">'+note+'</div>';sc.classList.add(variant===0?'fade':'slide');act('返回笔记列表','idle');$('state').textContent='同一条笔记，正文位置和内容保持稳定。'}
 else{sc.innerHTML='<div class="note-card"><div class="eyebrow">笔记 / 001</div><strong>让想法，慢慢变得清楚。</strong><p>一次关于观察与整理的记录。</p></div>';act('打开笔记详情','open',true);$('state').textContent='选择方案，再打开详情比较。'}
}else if(active==='type'){sc.innerHTML='<div class="readmode '+(variant===0?'mag':'sans')+'">'+note+'</div>';$('state').textContent='切换左侧方案，对比同一段内容的阅读感受。'}
else{
 sc.innerHTML=note;if(phase==='done'){if(variant===0)sc.insertAdjacentHTML('beforeend','<div class="saved">已保存 · 本地模拟结果</div>');act(variant===1?'已保存 · 再次编辑':'重新体验','idle');$('state').textContent='模拟保存成功，实际数据未写入。'}
 else if(phase==='error'){sc.insertAdjacentHTML('beforeend','<div class="error">保存失败 · 模拟。内容仍在，可重新尝试。</div>');act('重新尝试','saving',true)}
 else if(phase==='saving'){act('模拟保存成功','done',true);act('模拟保存失败','error');$('state').textContent='保存中 · 模拟。等待手动选择真实事件的替身。'}
 else{act('体验保存反馈','saving',true);$('state').textContent='先保存，再选择模拟成功或失败。'}
}}
function render(){const d=data[active];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.case===active));$('recommend').textContent=d.title;$('reason').textContent=d.reason;$('tradeoff').textContent=d.trade;$('contract').textContent=d.spec;$('current').textContent=d.names[variant];$('choices').replaceChildren();d.choices.forEach((label,i)=>{let b=button(label,()=>{variant=i;render();document.querySelectorAll("#choices button")[i]?.focus()});b.className='choice';b.setAttribute('aria-pressed',i===variant);$('choices').append(b)});renderScene()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{active=b.dataset.case;variant=0;phase='idle';render()});$('reduce').onchange=()=>document.body.classList.toggle('reduce',$('reduce').checked);render();
</script></body></html>
